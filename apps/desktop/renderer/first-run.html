<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:">
    <title id="page-title"></title>
    <link rel="stylesheet" href="first-run.css">
  </head>
  <body>
    <main class="setup">
      <canvas id="particles" aria-hidden="true"></canvas>
      <div class="ambient" aria-hidden="true"></div>
      <section class="setup-card" aria-labelledby="title">
        <div class="logo-stage" aria-hidden="true">
          <div class="logo-halo"></div>
          <img id="logo" src="deepseek-mark.svg" alt="" width="128" height="112">
        </div>
        <h1 id="title"></h1>
        <p id="description"></p>
        <div class="steps" aria-hidden="true">
          <span id="step-verify"></span><i></i><span id="step-prepare"></span><i></i><span id="step-open"></span>
        </div>
        <p id="status" role="status" aria-live="polite"></p>
        <progress id="progress" max="100"></progress>
        <p id="footnote"></p>
      </section>
    </main>
    <script src="first-run.js"></script>
  </body>
</html>
