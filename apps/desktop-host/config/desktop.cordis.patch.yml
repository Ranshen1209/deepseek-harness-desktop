# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- id: permission
  config:
    defaultPreset: workspace-write
    defaultSemanticsVersion: native-preservation-v1
    presets:
      read-only:
        sandbox: read-only
        approval: ask
        name: read-only
        description: Read files; changes require one-time approval to widen access.
      workspace-write:
        name: workspace-write
        description: Write inside the workspace and permitted temporary directories; wider retries require approval.
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        name: danger-full-access
        description: Full file access without approval prompts.
        sandbox: danger-full-access
        approval: never

- insert:
    - id: auto-review
      name: '@deepseek-ai/dsh-experimental-auto-review'

    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
