# Electron reuses the browser composition without its network and browser-launch rows.

- id: web-startup
  disabled: true

- id: webserver
  disabled: true

- id: web-runtime
  disabled: true

- id: client-hmr
  disabled: true

- id: open-in-app
  disabled: true

- id: ui-open-in-app
  disabled: true

- id: directory-picker
  disabled: true

- id: connection
  inject:
    - credentials
  config: {}

- id: permission
  config:
    defaultPreset: preservation
    presets:
      preservation:
        sandbox: workspace-write
        approval: ask
        name: Auto
        description: Model-reviewed task operations run automatically. Unclear authority requires confirmation. Exact external files and reversible single-file trash are supported; unisolated commands and permanent deletion remain blocked.
      workspace-write:
        name: Auto (legacy workspace)
        description: 'This saved selection uses Auto: model-reviewed file operations and reversible single-file trash, with confirmation when authority is unclear.'
        sandbox: workspace-write
        approval: ask
      danger-full-access:
        name: Auto (legacy full access)
        description: This saved selection uses Auto protection. Unisolated commands and permanent deletion remain blocked; it does not grant unrestricted access.
        sandbox: danger-full-access
        approval: never

- insert:
    - id: desktop-preservation-policy
      name: '@nanmicoder/dsh-auto-mode'
      config:
        presetName: preservation
        enforceAllSessions: true
        modelReview: true

    - id: directory-picker-native
      name: '@deepseek-ai/dsh-host-directory-picker-native'

    - id: ui-directory-picker-native
      name: '@deepseek-ai/dsh-client-ui-directory-picker-native'
