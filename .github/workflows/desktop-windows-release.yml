name: Desktop Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-windows-v*'

permissions:
  contents: read

env:
  DSH_DESKTOP_APP_ID: com.deepseek.harness.desktop
  DSH_DESKTOP_UNSIGNED: '1'

jobs:
  package-windows-x64:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - run: node .github/verify-desktop-version.mjs
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/desktop/tests/menu.spec.ts apps/desktop/tests/locale.spec.ts
      - run: pnpm run generate:desktop-icons
      - run: pnpm run package:desktop:win:x64
      - run: node .github/verify-desktop-version.mjs win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: apps/desktop/.desktop-build/targets/win-x64/artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-windows-v')
    needs: package-windows-x64
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release and upload Windows installer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes \
            --prerelease
          find release-artifacts -type f -name 'deepseek-harness-*.exe' -print0 \
            | xargs -0 gh release upload "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY"
