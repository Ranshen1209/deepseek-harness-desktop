name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

env:
  DSH_DESKTOP_APP_ID: com.deepseek.harness.desktop
  DSH_DESKTOP_UNSIGNED: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: node .github/verify-desktop-version.mjs

  package-macos-arm64:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/desktop/tests/runtime-image.spec.ts apps/desktop/tests/project-manager.spec.ts apps/desktop/tests/host-process.spec.ts apps/desktop/tests/locale.spec.ts
      - run: pnpm --filter @deepseek-ai/dsh-desktop exec playwright install chromium
      - run: pnpm --filter @deepseek-ai/dsh-desktop run test:ui
        env:
          DSH_DESKTOP_UI_ARTIFACTS: ${{ github.workspace }}/apps/desktop/.desktop-build/targets/mac-arm64/ui
      - run: pnpm run generate:desktop-icons
      - run: pnpm run package:desktop:mac:arm64
      - run: node .github/verify-desktop-version.mjs mac-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: |
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.dmg
            apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*.zip
            apps/desktop/.desktop-build/targets/mac-arm64/runtime-smoke.json
            apps/desktop/.desktop-build/targets/mac-arm64/ui/*.png
          if-no-files-found: error

  package-windows-x64:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/desktop/tests/runtime-image.spec.ts apps/desktop/tests/project-manager.spec.ts apps/desktop/tests/host-process.spec.ts apps/desktop/tests/menu.spec.ts apps/desktop/tests/locale.spec.ts
      - run: pnpm --filter @deepseek-ai/dsh-desktop run test:ui
        env:
          DSH_DESKTOP_UI_ARTIFACTS: ${{ github.workspace }}/apps/desktop/.desktop-build/targets/win-x64/ui
      - run: pnpm run generate:desktop-icons
      - run: pnpm run package:desktop:win:x64
      - run: node .github/verify-desktop-version.mjs win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: |
            apps/desktop/.desktop-build/targets/win-x64/artifacts/*.exe
            apps/desktop/.desktop-build/targets/win-x64/runtime-smoke.json
            apps/desktop/.desktop-build/targets/win-x64/ui/*.png
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [version, package-macos-arm64, package-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
      - name: Create GitHub Release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
        run: node --experimental-strip-types scripts/upload-desktop-github-release.ts --require mac-win
