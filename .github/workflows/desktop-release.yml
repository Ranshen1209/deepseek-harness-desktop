name: Desktop release

on:
  workflow_dispatch:
  push:
    tags:
      - 'desktop-v*'

permissions:
  contents: read

env:
  DSH_DESKTOP_APP_ID: com.deepseek.harness.desktop
  DSH_DESKTOP_UNSIGNED: '1'

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v6
      - id: version
        run: node .github/verify-desktop-version.mjs

  package-macos-arm64:
    needs: version
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run generate:desktop-icons
      - run: pnpm run package:desktop:mac:arm64
      - run: node .github/verify-desktop-version.mjs mac-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-macos-arm64
          path: apps/desktop/.desktop-build/targets/mac-arm64/artifacts/*
          if-no-files-found: error

  package-windows-x64:
    needs: version
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v6
      - uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
      - uses: actions/setup-node@v6
        with:
          node-version: 24.17.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec vitest run apps/desktop/tests/menu.spec.ts apps/desktop/tests/locale.spec.ts
      - run: pnpm run generate:desktop-icons
      - run: pnpm run package:desktop:win:x64
      - run: node .github/verify-desktop-version.mjs win-x64
      - uses: actions/upload-artifact@v4
        with:
          name: desktop-windows-x64
          path: apps/desktop/.desktop-build/targets/win-x64/artifacts/*
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/desktop-v')
    needs: [version, package-macos-arm64, package-windows-x64]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-artifacts
      - name: Create GitHub Release and upload installers
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_VERSION: ${{ needs.version.outputs.version }}
        run: |
          mkdir installers
          for suffix in mac-arm64.dmg mac-arm64.zip win-x64.exe; do
            filename="deepseek-harness-$RELEASE_VERSION-$suffix"
            artifact=$(find release-artifacts -type f -name "$filename")
            test -n "$artifact"
            cp "$artifact" "installers/$filename"
          done
          (cd installers && sha256sum deepseek-harness-* > SHA256SUMS.txt)
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --title "DeepSeek Harness Desktop $RELEASE_VERSION" \
            --draft \
            --notes "Desktop application and bundled dsh: $RELEASE_VERSION. macOS arm64 and Windows x64. Packages are unsigned and not notarized."
          gh release upload "$GITHUB_REF_NAME" installers/* --repo "$GITHUB_REPOSITORY"
          gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --prerelease=false --latest
