name: Consolidate desktop release assets

on:
  workflow_dispatch:
    inputs:
      mac_run_id:
        description: 'Successful macOS packaging run ID'
        required: true
        type: string
      windows_run_id:
        description: 'Successful Windows packaging run ID'
        required: true
        type: string
      release_id:
        description: 'Draft GitHub Release ID'
        required: true
        type: string
      release_tag:
        description: 'GitHub Release tag'
        required: true
        type: string
      mac_dmg_sha256:
        description: 'Expected macOS DMG SHA-256'
        required: true
        type: string
      mac_zip_sha256:
        description: 'Expected macOS ZIP SHA-256'
        required: true
        type: string
      windows_sha256:
        description: 'Expected Windows EXE SHA-256'
        required: true
        type: string

permissions:
  actions: read
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download final macOS artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-macos-arm64
          path: release-assets/mac
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.mac_run_id }}
      - name: Download final Windows artifact
        uses: actions/download-artifact@v4
        with:
          name: desktop-windows-x64
          path: release-assets/windows
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.windows_run_id }}
      - name: Verify and publish final platform assets
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_ID: ${{ inputs.release_id }}
          RELEASE_TAG: ${{ inputs.release_tag }}
          EXPECTED_MAC_DMG: ${{ inputs.mac_dmg_sha256 }}
          EXPECTED_MAC_ZIP: ${{ inputs.mac_zip_sha256 }}
          EXPECTED_WINDOWS: ${{ inputs.windows_sha256 }}
        run: |
          set -euo pipefail
          dmg="$(find release-assets/mac -type f -name '*-mac-arm64.dmg' -print -quit)"
          zip="$(find release-assets/mac -type f -name '*-mac-arm64.zip' -print -quit)"
          exe="$(find release-assets/windows -type f -name '*-win-x64.exe' -print -quit)"
          test -n "$dmg" && test -n "$zip" && test -n "$exe"
          test "$(sha256sum "$dmg" | cut -d' ' -f1)" = "$EXPECTED_MAC_DMG"
          test "$(sha256sum "$zip" | cut -d' ' -f1)" = "$EXPECTED_MAC_ZIP"
          test "$(sha256sum "$exe" | cut -d' ' -f1)" = "$EXPECTED_WINDOWS"
          upload_url="https://uploads.github.com/repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets"
          for asset in "$dmg" "$zip" "$exe"; do
            gh api --method POST \
              -H 'Content-Type: application/octet-stream' \
              --input "$asset" \
              "${upload_url}?name=$(basename "$asset")"
          done
          gh api --method PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false
